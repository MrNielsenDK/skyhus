[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skyhus"
version = "0.11.2"
description = "Qt user interface for multiple OneDrive accounts with abraunegg/onedrive"
readme = "README.md"
requires-python = ">=3.12"
# No pip dependencies: PySide6 and onedrive are system packages. The README has the apt install line.

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
skyhus = "skyhus.app:main"

[tool.setuptools]
packages = ["skyhus"]

[tool.setuptools.package-data]
skyhus = ["qml/*.qml", "qml/sheets/*.qml", "qml/components/*.qml",
                "assets/fonts/*", "assets/icons/*", "assets/skyhus.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
