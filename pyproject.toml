[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onedrive-gui"
version = "0.6.0"
description = "Qt-brugerflade til flere OneDrive-konti med abraunegg/onedrive"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
onedrive-gui = "onedrive_gui.app:main"

[tool.setuptools]
packages = ["onedrive_gui"]

[tool.setuptools.package-data]
onedrive_gui = ["qml/*.qml", "qml/sheets/*.qml", "qml/components/*.qml",
                "assets/fonts/*", "assets/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
