[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skyhus"
version = "0.8.0"
description = "Qt-brugerflade til flere OneDrive-konti med abraunegg/onedrive"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
skyhus = "skyhus.app:main"

[tool.setuptools]
packages = ["skyhus"]

[tool.setuptools.package-data]
skyhus = ["qml/*.qml", "qml/sheets/*.qml", "qml/components/*.qml",
                "assets/fonts/*", "assets/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
